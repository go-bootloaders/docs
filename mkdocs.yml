site_name: go-bootloaders
site_description: Pure-Go bootloader tooling — grub and systemd-boot ship today as production consumers of the storage/firmware/TPM stack; Limine, rEFInd, Syslinux, and U-Boot remain on the roadmap. No cgo.
site_url: https://go-bootloaders.github.io/docs/
repo_url: https://github.com/go-bootloaders
repo_name: go-bootloaders
edit_uri: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features: [navigation.sections, navigation.top, content.code.copy, search.suggest]

extra_css: [stylesheets/brand.css]
extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Components:
      - "grub — GRUB administration toolkit": components/grub.md
      - "systemd-boot — BLS reader + integration": components/systemd-boot.md
  - Roadmap & Status: roadmap.md
